# ATLAS Manual High-Probability Market Scanner — XAUUSD primary
# Analysis only. You confirm on TradingView and trade yourself. No auto orders.

mode: PAPER  # PAPER | LIVE via ATLAS_MODE (LIVE ignored for scanner orders)

institutional:
  symbol: XAUUSD
  magic: 26080501

  # Multi-timeframe stack (M1 = timing context only)
  timeframes: [H4, H1, M15, M5, M1]

  # Quality gates for setup status readout (not auto-entry)
  min_probability: 70.0
  min_confidence: 62.0
  min_confluence: 65.0
  min_reward_risk: 2.5
  require_htf_alignment: true
  require_m1_timing: true
  require_playbook: true

  # Confluence weights (sum ≈ 100)
  weights:
    trend: 12
    market_structure: 14
    liquidity: 10
    support_resistance: 10
    order_blocks: 8
    fair_value_gaps: 8
    fibonacci: 8
    trendlines: 5
    price_action: 8
    momentum: 5
    volatility: 4
    news: 4
    session: 4

  risk:
    risk_percent: 0.35
    max_open_positions: 1
    max_daily_trades: 6
    max_consecutive_losses: 3
    daily_loss_limit_percent: 1.5
    daily_profit_target_percent: 2.0
    pause_after_daily_limit: true
    atr_stop_mult: 1.2
    atr_tp_mult: 3.0

  # Prop challenge manual plan (YOU place 0.1 lot — bot does not auto-trade)
  challenge:
    enabled: true
    lot_size: 0.1
    max_risk_usd: 50.0
    # XAUUSD: ~$100 P/L per $1 price move on 1.0 lot → $10 on 0.1 lot
    # so $50 risk ≈ $5.00 stop distance
    usd_per_price_unit_per_lot: 100.0
    min_rr_tp1: 2.0
    min_rr_tp2: 3.0
    max_zone_width_atr: 1.25
    prefer_distance_atr: 1.2

  news:
    enabled: true
    block_minutes_before_high: 30
    block_minutes_after_high: 30

  analysis:
    swing_lookback: 3
    structure_bars: 120
    sr_lookback: 200
    fib_min_swing_atr: 1.5
    equal_level_tolerance_atr: 0.15

  logging:
    dir: logs/institutional
