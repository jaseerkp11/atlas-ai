# ATLAS XAUUSD High-Speed Tick Scalper
# RAPID CYCLE: open → bank tiny profit ASAP → re-enter (every tick / ~each second)

mode: PAPER  # PAPER | LIVE

tick_scalper:
  symbol: XAUUSD
  magic: 26080401
  poll_sleep_ms: 0              # lowest latency busy-poll
  require_price_change: true

  max_spread_points: 45.0
  max_slippage_points: 40.0

  # 1.0 lot (user request) — keep
  use_fixed_lots: true
  fixed_lots: 1.0
  max_lots: 1.0
  risk_percent: 0.25

  # RAPID PROFIT MACHINE
  # Close the INSTANT unrealized PnL >= instant_profit_points (bid/ask aware).
  # Hard TP is a backup if it runs further; SL still protects losers.
  rapid_cycle: true
  instant_profit_points: 3.0    # bank +3 pts (~$3 / 1.0 lot) as soon as green enough
  take_profit_points: 25.0      # hard TP backup
  stop_loss_points: 50.0        # must keep SL — cannot only close winners
  max_open_positions: 1
  daily_loss_limit_percent: 1.5
  cooldown_ms_after_close: 0    # re-scan immediately after close

  # Faster entries (still need short-tape edge — not a blind timer)
  vwap_enabled: false           # off = more frequent cycles
  vwap_near_points: 80.0
  min_tick_momentum: 2
  momentum_lookback: 4
  min_tick_range_points: 2.0
  session_hours_utc: [0, 24]

  log_every_tick: false
  tick_summary_every_n: 500
  log_dir: logs/tick_scalper
