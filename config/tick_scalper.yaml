# ATLAS XAUUSD High-Speed Tick Scalper
# Burst multi-entry: open up to 6 fast, each closes on profit OR tight SL, then next.

mode: PAPER  # PAPER | LIVE

tick_scalper:
  symbol: XAUUSD
  magic: 26080401
  poll_sleep_ms: 0
  require_price_change: true

  max_spread_points: 35.0
  max_slippage_points: 80.0

  use_fixed_lots: true
  fixed_lots: 1.0
  max_lots: 1.0
  risk_percent: 0.25

  rapid_cycle: true
  # Fast profit takes
  profit_ladder_points: [5.0, 5.0, 8.0, 8.0, 12.0, 12.0]
  instant_profit_points: 5.0
  take_profit_points: 30.0
  # Dynamic SL floor also applied in code (spread-aware). This is the base.
  stop_loss_points: 45.0
  max_open_positions: 6
  # Allow burst entries in the same second (user request)
  pyramid_winners_only: false
  min_points_between_entries: 0.0
  daily_loss_limit_percent: 2.0
  cooldown_ms_after_close: 0

  # Timeframes for higher-quality entries (exits still every tick)
  # MT5 has no native 1s/5s charts — we build them from ticks.
  micro_tf_seconds: 5          # 1 or 5 second synthetic candles
  require_micro_bar_close: true  # enter only when a micro-bar just closed
  micro_bars_agree: 2          # last N micro-bars must agree direction
  use_m1_filter: true          # also require last closed M1 candle alignment
  m1_lookback: 3               # majority of last N M1 candles

  vwap_enabled: false
  vwap_near_points: 80.0
  min_tick_momentum: 2
  momentum_lookback: 4
  min_tick_range_points: 2.0
  session_hours_utc: [0, 24]

  log_every_tick: false
  tick_summary_every_n: 500
  log_dir: logs/tick_scalper
