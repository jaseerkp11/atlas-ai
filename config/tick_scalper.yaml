# ATLAS XAUUSD — M1 price-action alternating batches of 5
# Open 5 → each closes at +1.5 pts profit → next batch OPPOSITE side → repeat.

mode: PAPER  # PAPER | LIVE

tick_scalper:
  symbol: XAUUSD
  magic: 26080401
  poll_sleep_ms: 0
  require_price_change: true

  max_spread_points: 40.0
  max_slippage_points: 80.0

  use_fixed_lots: true
  fixed_lots: 1.0
  max_lots: 1.0
  risk_percent: 0.25

  rapid_cycle: true
  # +1.5 point profit on EVERY trade (XAU point = 0.01 → $1.50 / 1.0 lot)
  instant_profit_points: 1.5
  profit_ladder_points: [1.5, 1.5, 1.5, 1.5, 1.5]
  take_profit_points: 8.0
  stop_loss_points: 40.0
  max_open_positions: 5
  burst_fill: true
  # Wait until flat, then open next 5 on OPPOSITE side
  alternate_batch_side: true
  require_flat_before_next_batch: true
  pyramid_winners_only: false
  min_points_between_entries: 0.0
  daily_loss_limit_percent: 2.5
  cooldown_ms_after_close: 0

  use_m1_price_action: true
  m1_structure_bars: 12
  m1_poll_seconds: 1
  # legacy off
  micro_tf_seconds: 5
  require_micro_bar_close: false
  micro_bars_agree: 1
  use_m1_filter: false
  m1_lookback: 3
  vwap_enabled: false
  vwap_near_points: 80.0
  min_tick_momentum: 1
  momentum_lookback: 2
  min_tick_range_points: 0.0
  session_hours_utc: [0, 24]

  log_every_tick: false
  tick_summary_every_n: 500
  log_dir: logs/tick_scalper
