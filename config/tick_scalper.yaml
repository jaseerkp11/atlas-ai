# ATLAS XAUUSD High-Speed Tick Scalper
# Optimized for every incoming MT5 tick (not candle closes).

mode: PAPER  # PAPER | LIVE — use PAPER first on demo

tick_scalper:
  symbol: XAUUSD
  magic: 26080401
  # Poll MT5 for new ticks (ms). 0 = busy-wait (lowest latency, higher CPU).
  poll_sleep_ms: 1
  # Only evaluate strategy when bid/ask actually changes
  require_price_change: true

  # Spread / slippage filters (gold points; 1 point = 0.01 on typical XAU quotes)
  max_spread_points: 40.0
  max_slippage_points: 30.0

  # Risk — prefer fixed micro lot on gold (avoids "No money" from bad tick-value math)
  use_fixed_lots: true
  fixed_lots: 0.01
  max_lots: 0.05            # hard cap even if risk% sizing is enabled
  risk_percent: 0.25        # only used when use_fixed_lots: false
  stop_loss_points: 80.0
  take_profit_points: 120.0
  max_open_positions: 1
  daily_loss_limit_percent: 1.5
  cooldown_ms_after_close: 500

  # Strategy edge filters (all must pass — never force trades)
  vwap_enabled: true
  vwap_near_points: 50.0
  min_tick_momentum: 3
  momentum_lookback: 8
  min_tick_range_points: 5.0
  # XAUUSD trades almost 24h Mon–Fri. [0,24) = all hours; weekends still blocked in code.
  session_hours_utc: [0, 24]

  # Logging
  log_every_tick: false
  tick_summary_every_n: 500
  log_dir: logs/tick_scalper
